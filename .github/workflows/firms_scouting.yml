name: "FIRMS NRT Scouting - Leoncio Prado"

on:
  schedule:
    # Ejecutar todos los días a las 12:00 UTC (07:00 AM hora de Perú - UTC-5)
    - cron: "0 12 * * *"
  workflow_dispatch: # Permite ejecución manual bajo demanda desde GitHub

permissions:
  contents: write # Permiso necesario para commitear el histórico de quemas actualizado

jobs:
  scout-and-notify:
    name: "Scouting de Focos de Calor y Alerta Telegram"
    runs-on: ubuntu-latest

    steps:
      - name: "1. Clonar repositorio"
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: "2. Configurar entorno Python"
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: "pip"

      - name: "3. Instalar dependencias"
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: "4. Ejecutar script de monitoreo FIRMS NRT"
        env:
          FIRMS_API_KEY: ${{ secrets.FIRMS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # --incluir-baja-confianza conserva las detecciones que no superan el
          # umbral, marcadas con tipo_registro=baja_confianza. No alteran el
          # conteo de focos validados y permiten analizar omision en la tesis.
          python main.py --incluir-baja-confianza

      - name: "5. Guardar y commitear histórico y registro de ejecuciones"
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          ARCHIVOS=""
          for f in historico_leoncio_prado_2026.csv registro_ejecuciones.csv; do
            if [ -f "$f" ]; then
              git add "$f"
              ARCHIVOS="$ARCHIVOS $f"
            fi
          done

          if [ -z "$ARCHIVOS" ]; then
            echo "No se encontraron archivos de datos para versionar."
            exit 0
          fi

          echo "Archivos preparados:$ARCHIVOS"

          if git diff --staged --quiet; then
            echo "Sin cambios en los datos respecto al commit anterior."
          else
            FECHA=$(date -u +"%Y-%m-%d")
            git commit -m "chore(data): actualización automática histórico de quemas [$FECHA] [skip ci]"
            git push
            echo "Datos sincronizados en la rama principal."
          fi
